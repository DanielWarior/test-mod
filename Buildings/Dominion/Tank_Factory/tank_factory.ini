[core]

name: tank_factory
class: CustomUnitMetadata
maxHp: 2000
price: 1000
mass: 1000

displayText: Tank Factory
displayDescription: -Dominion's tank factory \n-produces tanks which are slower and more powerful than light vehicles

displayText_ru: Танковый завод
displayDescription_ru: -Танковый завод доминиона \n-Производит танки что медленний но сильнее легкой техники

radius: 60
displayRadius:60

buildSpeed: 16s

#footprint used for collisions with units (left, up, right, down)
footprint: -1,-1,1,2

#used for placement, and placement of other buildings
constructionFootprint: -1,-1,1,2

isBuilding: true
explodeTypeOnDeath: building

canBuild_1_name: setRally
canBuild_1_pos:  0.1

canBuild_2_name: dominion_builder,legionaire,sagittarii,birdeater,pilum,thunder,mallet,shepherd
canBuild_2_pos:  1


[graphics]

image: tank_factory.png
image_back: tank_factory_back.png
image_wreak: tank_factory_wreck.png

image_shadow: auto
shadowOffsetX:1
shadowOffsetY:1

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits: false
canAttackUnderwaterUnits: false

[action_upgrade]
text:Upgrade to T2
text_ru:Улучшить до Т2

description:-Upgrading the factory will allow construction of stronger tanks
description_ru:-Улучшение завода позволит производить более совершенные танки

pos:0.1
isVisible: if numberOfUnitsInTeam(withTag="T2_tankFactory") == 0
isLockedMessage: We did not invent this yet
price:4000
buildSpeed:80s

allowMultipleInQueue:false
iconImage: SHARED:icon_upgrade.png
displayType: upgrade
convertTo: tank_factory_t2

[action_upgrade_consecutive]
text:Upgrade to T2
text_ru:Улучшить до Т2

description:-Upgrading the factory will allow construction of stronger tanks(cheaper and faster due to already existing T2 factory of this type)
description_ru:-Улучшение завода позволит производить более совершенные танки(Быстрее и дешевле из за наличия т2 завода этого типа)

pos:0.1
isVisible: if numberOfUnitsInTeam(withTag="T2_tankFactory") > 0
isLockedMessage: We did not invent this yet
price:2000
buildSpeed:40s

allowMultipleInQueue:false
iconImage: SHARED:icon_upgrade.png
displayType: upgrade
convertTo: tank_factory_t2

[arm_1]
x:0
y:5
image_end:tank_factory_door.png


[animation_openDoor]

onActions: queuedUnits
onActionsQueuedUnitPlayAt: 0.8

blendIn: 1s
blendOut: 4s

arm1_0: {x:0, y:26}

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1

[ai]
buildPriority: 0.50
noneInBaseExtraPriority: 0.15
noneGlobalExtraPriority: 0.15
maxEachBase:1
maxGlobal:5
ai_upgradePriority:0.3
