[core]
name:air_mine_base
class: CustomUnitMetadata
price: 600
maxHp: 1000
mass: 60
buildSpeed: 15s
effectOnDeath:smallExplosion
isBuilding:true
showInEditor:false

displayText: Air-mine
displayDescription:-Blimp tied to the ground with an explosive payload inside \n-aircraft deterrent\n-In dominion, baloon blows you.

displayText_ru: Воздушная мина
displayDescription_ru:-Воздушный шар привязанный к земле с взрывчаткой внутри. \n-Отпугиватель воздуха\n-В доминионе, шарики взрывают тебя.

fogOfWarSightRange: 1

footprint: 0,0,0,0
constructionFootprint: 0,0,0,0

buildingToFootprintOffsetX:10
buildingToFootprintOffsetY:10

tags:air_mine_base

radius: 7
displayRadius: 7
[graphics]
image_wreak:air_mine_wreck.png
image:air_mine_back.png
image_turret:NONE

drawLayer:wreaks

image_shadow: auto
shadowOffsetX:2
shadowOffsetY:2

[attack]
canAttack: false

[hiddenAction_1]
autoTriggerOnEvent:completeAndActive
setCustomTarget1:nearestUnit(withTag="air_mine")

[hiddenAction_2]
autoTriggerOnEvent:created
resetCustomTimer:true
[decal_line]
teamColors:true
lineWidth:2.5
drawLineTo:customTarget1
color:#303030
onlyWhileAlive:true
[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1

[hiddenAction_kys]
autoTrigger:if numberOfUnitsInTeam(withTag='air_mine', lessThan=1, withinRange=20) and self.customTimer(laterThanSeconds=5)
addResources: hp=-1200