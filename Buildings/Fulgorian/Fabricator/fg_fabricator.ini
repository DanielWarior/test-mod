[core]
name: fg_fabricator
class: CustomUnitMetadata
maxHp: 800
price: 2000
mass: 1000
tags: fabricator

displayText: Fulgorian Harvester
displayDescription: - A conduit to harvest energy essence\n- Generates little income \n- Explodes on death \n- GRRRR PENDING SPRITE....

generation_credits:2

fogOfWarSightRange: 5

radius: 40
displayRadius:60

footprint: -2,-2,1,1
constructionFootprint: -2,-2,1,1

buildingToFootprintOffsetX:0
buildingToFootprintOffsetY:-5

nukeOnDeath:true
nukeOnDeathRange:120
nukeOnDeathDamage:1000

buildSpeed:70s

isBuilding: true
explodeTypeOnDeath: building

borrowResourcesWhileAlive: maxfabs=1

[graphics]
total_frames: 3

imageScale:1.4

image: fg_fabricator.png
image_wreak: fg_fabricator_dead.png

animation_idle_start:0
animation_idle_end:2
animation_idle_speed:9

image_shadow: auto
shadowOffsetX:1
shadowOffsetY:1

[action_upgrade]
convertTo: fg_fabricator_t2
price: 4000
text: Upgrade
description: Upgrade into T2
displayType: Upgrade
buildSpeed: 30s
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF

[action_cap]
isActive: false
displayType: infoOnly
price: maxfabs=1
addResources: maxfabs=1
displayRemainingStockpile: true

[hiddenAction_refund]
requireConditional:  if self.numberOfUnitsInTeam(withTag='fabricator', greaterThan=0, incompleteBuildings=true) and self.resource(type='maxfabs')<0 
autoTriggerOnEvent: created
addResources: ${core.price}
deleteSelf: true
showMessageToPlayer: You have built the maximum amount of Fabricators you can have at the same time.
showMessageToPlayer_ru: Вы построили максимально возможное количество фабрикаторов(40)
showMessageToPlayer_zh: 你已经建造了最大数量的资源制造仪

[attack]
canAttack: false

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1