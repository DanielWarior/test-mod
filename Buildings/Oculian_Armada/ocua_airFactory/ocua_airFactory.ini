
[core]
name: ocua_airFactory
displayText: Oculian Armada Fighter Factory
class: CustomUnitMetadata
price: 1000
maxHp: 1000
mass: 3000
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingToFootprintOffsetX: 10
buildingToFootprintOffsetY: 15
techLevel: 1
buildSpeed: 15s
radius: 30
isBio: false
isBuilding: true
exit_x:0
exit_y:-1
exit_moveAwayAmount:90
canBuild_1_name: setRally
canBuild_1_pos:  1
tags: cancerbay, cancerelitebay, cancermibay
maxTransportingUnits: 4
transportUnitsRequireTag: cancerreload, cancerelitereload, cancermireload
transportUnitsRequireMovementType: AIR
transportUnitsBlockAirAndWaterUnits: false
transportUnitsAddUnloadOption: false



[canBuild_1]
name: breeze, breeze_elite, cell, kaleido, cancer_missile, tick
pos: 1



[action_upgrade]
convertTo: ocua_airFactory_T2
price:  3000
text: Upgrade - T2
description:T2 Fighter Factory
displayType: upgrade
buildSpeed: 50s
pos: 0.2
attachments_deleteNumUnits: 1
attachments_addNewUnits: ocua_airFactory_t2_top
addResources: slots=2
iconImage: SHARED:icon_upgrade.png

isVisible: if numberOfUnitsInTeam(withTag="T2_air") == 0



[action_upgrade_consecutive]
convertTo: ocua_airFactory_T2
price:  1500
text: Upgrade - T2
description:T2 Fighter Factory
displayType: upgrade
buildSpeed: 25s
pos: 0.2
attachments_deleteNumUnits: 1
attachments_addNewUnits: ocua_airFactory_t2_top
attachments_onlyOnSlots: 1
iconImage: SHARED:icon_upgrade.png
addResources: slots=2

isVisible: if numberOfUnitsInTeam(withTag="T2_air") > 0



[hiddenAction_spawn]
autoTriggerOnEvent: completeAndActive
addResources: slots=4



[hiddenAction_open]
autoTriggerOnEvent: queuedUnitFinished
temporarilyAddTags: open
resetCustomTimer: true



[hiddenAction_close]
autoTrigger: if self.customTimer(laterThanSeconds=1.5) and self.tags(includes='open')
temporarilyRemoveTags: open



[hiddenAction_cancerfull]
autoTrigger: if self.resource(type='slots', lessThan=1)
temporarilyRemoveTags: cancerbay



[hiddenAction_cancernotfull]
autoTrigger: if self.resource(type='slots', greaterThan=0)
temporarilyAddTags: cancerbay



[hiddenAction_cancerelitefull]
autoTrigger: if self.resource(type='slots', lessThan=2)
temporarilyRemoveTags: cancerelitebay



[hiddenAction_cancerelitenotfull]
autoTrigger: if self.resource(type='slots', greaterThan=1)
temporarilyAddTags: cancerelitebay



[hiddenAction_cancermifull]
autoTrigger: if self.resource(type='slots', lessThan=3)
temporarilyRemoveTags: cancermibay



[hiddenAction_cancerminotfull]
autoTrigger: if self.resource(type='slots', greaterThan=2)
temporarilyAddTags: cancermibay



[hiddenAction_reloadCancer]
autoTrigger: if self.transportingUnitWithTags(includes='cancer') and not self.tags(includes='reloading')
alsoQueueAction: reloadingCancer
temporarilyAddTags: reloading



[hiddenAction_reloadingCancer]
buildSpeed: 6s
alsoTriggerAction: open
deleteNumUnitsFromTransport: 1
deleteNumUnitsFromTransport_onlyWithTags: cancerreload
addUnitsIntoTransport: cancer_missile
temporarilyRemoveTags: reloading
addResources: slots=1



[hiddenAction_reloadCancerElite]
autoTrigger: if self.transportingUnitWithTags(includes='cancerelite') and not self.tags(includes='reloading')
alsoQueueAction: reloadingCancerElite
temporarilyAddTags: reloading



[hiddenAction_reloadingCancerElite]
buildSpeed: 8s
alsoTriggerAction: open
deleteNumUnitsFromTransport: 1
deleteNumUnitsFromTransport_onlyWithTags: cancerelitereload
addUnitsIntoTransport: cancer_elite_missile
temporarilyRemoveTags: reloading
addResources: slots=2



[hiddenAction_reloadCancerMi]
autoTrigger: if self.transportingUnitWithTags(includes='cancermi') and not self.tags(includes='reloading')
alsoQueueAction: reloadingCancerMi
temporarilyAddTags: reloading



[hiddenAction_reloadingCancerMi]
buildSpeed: 10s
alsoTriggerAction: open
deleteNumUnitsFromTransport: 1
deleteNumUnitsFromTransport_onlyWithTags: cancermireload
addUnitsIntoTransport: cancer_mi_missile
temporarilyRemoveTags: reloading
addResources: slots=3



