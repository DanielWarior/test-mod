
[core]
name: ocua_extractor
displayText: Oculian Extractor
displayDescription: Oculian Armada Extractor\n-Faster to build but fragile, can go high into the air to become untargettable temporarily but also stops generating. \n-Can place Core modules in it to change stats, usually interacts with the fly ability. \n-Core Modules become stronger per tier, but also become more expensive.
price: 700
maxHp: 400
radius: 18
displayRadius:20
techLevel: 1
buildSpeed: 12.5s
mass: 45000
footprint: 0,0,0,0
constructionFootprint: 0,0,0,0
buildingSelectionOffset:4
isBuilding: true
placeOnlyOnResPool: true
numBitsOnDeath: 8
hideScorchMark: true
effectOnDeath: resourcePoolSmoke
explodeTypeOnDeath: buildingNoShockwaveOrSmoke
generation_resources: credits=10
tags:killBlank,extractor
energyMax: 9



[action_fly]
ai_isDisabled: true
autoTrigger: if self.isControlledByAi() and not self.tags(includes='chemical') and not self.tags(includes='pulse') and self.customTimer(laterThanSeconds=39) and (self.numberOfUnitsInEnemyTeam(withinRange=300, greaterThan=2) or self.hasTakenDamage(withinSeconds=1))
isVisible: if not self.tags(includes='chemical') and not self.tags(includes='pulse')
buildSpeed: 1s
text: Fly
description: -Flies for 9 Seconds to temporarily avoid all attacks. \n-30s Cooldown
canPlayerCancel: false
convertTo: ocua_extractor_air
convertTo_keepCurrentTags: true
convertTo_keepCurrentFields: maxShield, shieldRegen
spawnUnits:blank
temporarilyRemoveTags:killBlank



[action_attack]
ai_isDisabled: true
autoTrigger: if self.isControlledByAi() and self.tags(includes='chemical') and self.customTimer(laterThanSeconds=39) and (self.numberOfUnitsInEnemyTeam(withinRange=300, greaterThan=2) or self.hasTakenDamage(withinSeconds=1))
isVisible: if self.tags(includes='chemical')
buildSpeed: 1s
text: Fly
description: -Flies for 9 Seconds to temporarily avoid all attacks. \n-30s Cooldown
addActionCooldownTime: 39s
canPlayerCancel: false
convertTo: ocua_extractor_attack
convertTo_keepCurrentTags: true
convertTo_keepCurrentFields: maxShield, shieldRegen
spawnUnits:blank
temporarilyRemoveTags:killBlank



[action_detonate]
ai_isDisabled: true
autoTrigger: if self.isControlledByAi() and self.tags(includes='pulse') and (self.hp < self.maxHp/2)
isVisible: if self.tags(includes='pulse')
buildSpeed: 1s
text: Detonate
description: -Flies for 5 seconds to shoot a highly damaging aoe beam at the ground then dies.
canPlayerCancel: false
convertTo: ocua_extractor_detonate
convertTo_keepCurrentTags: true
convertTo_keepCurrentFields: maxShield, shieldRegen



[action_upgrade]
isVisible: if not self.tags(includes='chemical') and not self.tags(includes='crystalline') and not self.tags(includes='pulse')
convertTo: ocua_extractor_t2
price: 1500
text: Upgrade T2
description: 15$ Generation
displayType: upgrade
buildSpeed: 25s
temporarilyAddTags: t2
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
convertTo_keepCurrentTags: true



[action_chemicalupgrade]
isVisible: if self.tags(includes='chemical')
convertTo: ocua_extractor_t2
price: 1750
text: Upgrade T2
description: 15$ Generation
displayType: upgrade
buildSpeed: 25s
temporarilyAddTags: t2
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
convertTo_keepCurrentTags: true



[action_crystallineupgrade]
isVisible: if self.tags(includes='crystalline')
convertTo: ocua_extractor_t2
price: 2000
text: Upgrade T2
description: 15$ Generation
displayType: upgrade
buildSpeed: 25s
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
temporarilyAddTags: t2
convertTo_keepCurrentTags: true
convertTo_keepCurrentFields: maxShield, shieldRegen
setUnitStats: maxShield += 750, shieldRegen += 0.1



[action_pulseupgrade]
isVisible: if self.tags(includes='pulse')
convertTo: ocua_extractor_t2
price: 2250
text: Upgrade T2
description: 15$ Generation
displayType: upgrade
buildSpeed: 25s
temporarilyAddTags: t2
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF
convertTo_keepCurrentTags: true



[action_revert]
isVisible: if self.tags(includes='core')
ai_isDisabled: true
buildSpeed: 5s
price: -500
text: Remove Core
description: Removes the core, turning back to normal
attachments_deleteNumUnits: 1
temporarilyRemoveTags: core, chemical, crystalline
allowMultipleInQueue: false
resetUnitStats: true



[action_chemical]
isVisible: if not self.tags(includes='core')
buildSpeed: 20s
price: 750
text: Chemical Core
description: Adds Chemical Core \n-While in the air, it can shoot at both ground and air units with a beam.
attachments_addNewUnits: ocua_extractor_chemical
temporarilyAddTags: core, chemical
allowMultipleInQueue: false
unitShownInUI: ocua_extractor_chemical



[action_crystalline]
isVisible: if not self.tags(includes='core')
buildSpeed: 20s
price: 1500
text: Crystalline Core
description: Adds Crystalline Core \n-Gains a shield and adds a Repair Bay that cannot be controlled.
attachments_addNewUnits: ocua_extractor_crystalline
temporarilyAddTags: core, crystalline
allowMultipleInQueue: false
setUnitStats: maxShield = 750, shieldRegen = 0.1
unitShownInUI: ocua_extractor_crystalline



[action_pulse]
isVisible: if not self.tags(includes='core')
buildSpeed: 20s
price: 1500
text: Pulse core
description: Adds Pulse Core \n-Replaces the fly ability with detonate, letting it move and fly while shooting a highly damaging beam at the ground, but dies afterwards and can't hit air.
attachments_addNewUnits: ocua_extractor_pulse
temporarilyAddTags: core, pulse
convertTo_keepCurrentTags: true
unitShownInUI: ocua_extractor_pulse



[attachment_1]
x: 0
y: -2.5
idleDir: 0
isVisible: true
isUnselectable: true
