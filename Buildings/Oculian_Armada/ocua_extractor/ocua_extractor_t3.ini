
[core]
name: ocua_extractor_t3
displayText: Oculian Extractor T3
copyFrom: ocua_extractor.ini
price: 2950
maxHp: 1000
generation_resources: credits=20
buildSpeed: 80s
tags:killBlank,extractor,t3
energyMax: 15



[graphics]
image: ocua_extractor_t3.png



[action_fly]
autoTrigger: if self.isControlledByAi() and not self.tags(includes='chemical') and not self.tags(includes='pulse') and self.customTimer(laterThanSeconds=45) and (self.numberOfUnitsInEnemyTeam(withinRange=300, greaterThan=2) or self.hasTakenDamage(withinSeconds=1))
convertTo: ocua_extractor_t3_air
description: -Flies for 15 Seconds to temporarily avoid all attacks. \n-30s Cooldown



[action_attack]
autoTrigger: if self.isControlledByAi() and self.tags(includes='chemical') and self.customTimer(laterThanSeconds=45) and (self.numberOfUnitsInEnemyTeam(withinRange=300, greaterThan=2) or self.hasTakenDamage(withinSeconds=1))
