
[core]
name: ocua_extractor_t4
displayText: Oculian Extractor T4
copyFrom: ocua_extractor.ini
price: 5200
maxHp: 1400
generation_resources: credits=25, crystal=1
buildSpeed: 140s
tags:killBlank,extractor,t4
energyMax: 20



[graphics]
image: ocua_extractor_t4.png



[action_fly]
autoTrigger: if self.isControlledByAi() and not self.tags(includes='chemical') and not self.tags(includes='pulse') and self.customTimer(laterThanSeconds=50) and (self.numberOfUnitsInEnemyTeam(withinRange=300, greaterThan=2) or self.hasTakenDamage(withinSeconds=1))
convertTo: ocua_extractor_t4_air
description: -Flies for 20 Seconds to temporarily avoid all attacks. \n-30s Cooldown



[action_attack]
autoTrigger: if self.isControlledByAi() and self.tags(includes='chemical') and self.customTimer(laterThanSeconds=50) and (self.numberOfUnitsInEnemyTeam(withinRange=300, greaterThan=2) or self.hasTakenDamage(withinSeconds=1))
convertTo: ocua_extractor_t4_attack
description: -Flies for 20 Seconds to temporarily avoid all attacks. \n-30s Cooldown
addActionCooldownTime: 50s



[action_detonate]
convertTo: ocua_extractor_t4_detonate



