
[core]
name: ocua_fabricator
displayText: Oculian Rain Collector
displayDescription: Oculian Armada Fabricator\n-Generates income without requiring a resource pool, but is much less efficient to make than an extractor. \n-Doesn't explode hazardously. \n-Can be placed on water.
price: 2000
maxHp: 500
radius: 20
displayRadius:20
techLevel: 1
buildSpeed: 50s
mass: 1000
footprint: -1,-1,1,1
constructionFootprint: -1,-1,1,1
buildingSelectionOffset:4
isBuilding: true
numBitsOnDeath: 12
hideScorchMark: true
explodeTypeOnDeath: buildingNoShockwaveOrSmoke
generation_resources: credits=2
borrowResourcesWhileAlive: maxfabs=1
fogOfWarSightRange: 5
tags: fabricator



[action_upgrade]
convertTo: ocua_fabricator_t2
price: 4000
text: Upgrade
description: Upgrade into t2 version
displayType: Upgrade
buildSpeed: 30s
iconExtraImage: SHARED:icon_upgrade_top.png
iconExtraColor: #AAFFFFFF



[action_cap]
isActive: false
displayType: infoOnly
price: maxfabs=1
addResources: maxfabs=1
displayRemainingStockpile: true



[hiddenAction_refund]
requireConditional:  if self.numberOfUnitsInTeam(withTag='fabricator', greaterThan=0, incompleteBuildings=true) and self.resource(type='maxfabs')<0 
autoTriggerOnEvent: created
addResources: ${core.price}
deleteSelf: true
showMessageToPlayer: You have built the maximum amount of Fabricators you can have at the same time.
showMessageToPlayer_ru: Вы построили максимально возможное количество фабрикаторов(40)
showMessageToPlayer_zh: 你已经建造了最大数量的资源制造仪



[graphics]
total_frames: 3
image: ocua_fabricator.png
image_shadow: AUTO
shadowOffsetX:0
shadowOffsetY:0



[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0



[movement]
movementType: HOVER
targetHeight: 15
targetHeightDrift: 1.5
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01
maxTurnSpeed: 0
turnAcceleration: 0.1



[animation_idle]
onActions : idle
pingPong: false
KeyframeTimeScale: 1
body_0s: {frame:1}
body_0.5s: {frame:2}
body_1.0s: {frame:2}



[ai]
buildPriority: 0.4
noneInBaseExtraPriority: 0.43
maxEachBase: 99