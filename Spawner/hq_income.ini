[core]
name: hq_income
class: CustomUnitMetadata
maxHp: 100000
price: 1
mass: 1
radius: 1
explodeTypeOnDeath: building
autoTriggerCooldownTime: 40
@memory enemyhq:number
@memory friendlyhq:number
showInEditor: false

[hiddenAction_created]
autoTriggerOnEvent: created
setUnitMemory: enemyhq=self.numberOfUnitsInEnemyTeam(withTag='hq'), friendlyhq=(self.numberOfUnitsInTeam(withTag='hq')+self.numberOfUnitsInAllyTeam(withTag='hq'))

[hiddenAction_givemoney]
autoTrigger: if memory.enemyhq > memory.friendlyhq
requireConditional: if self.numberOfUnitsInAllTeams(withTag='fair') > 0
addResourcesWithLogic: credits=((20*memory.enemyhq)/memory.friendlyhq)-20

[graphics]
image: spawner.png
drawLayer:bottom

[movement]
movementType: NONE
moveSpeed: 0
moveAccelerationSpeed: 0.01
moveDecelerationSpeed: 0.01

maxTurnSpeed: 0
turnAcceleration: 0.1

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0