[core]

name:schuetze

tags:infantry
displayText: Schuetze
displayDescription: -Dominion's standart soldier \n-fragile but good dps for cost \n-effective while being covered by trenches or vehicles \n-Slight shield damage reduction due to low caliber

displayText_ru: Шуцце
displayDescription_ru:-Стандартный солдат доминиона\n-Хрупкий но имеет хороший хороший дпс за свою цену\n-Эффективен пока находится в укрытии или технике\n-слабое уменьшение урона по щитам из за малого калибра

copyFrom:ROOT:Templates\customEffects.template

class: CustomUnitMetadata
price: 200
maxHp: 65
mass: 100
selfRegenRate:0.05

fogOfWarSightRange: 18

isUnrepairableUnit:true

techLevel: 1
buildSpeed: 2s
#availableInDemo: true

radius: 6
displayRadius: 7

isBio: true
softCollisionOnAll: 5

[graphics]
#total_frames: 8

image:        Schuetze.png
image_wreak:  none
image_turret: Schuetze_gun.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


#animation_moving_start: 0
#animation_moving_end: 7
#animation_moving_speed: 2

[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=150)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=60) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat') and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=500)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true

turretSize: 5
turretTurnSpeed: 8


maxAttackRange: 170

turretRotateWithBody: true

shootDelay: 33


[turret_2]
#
x: 0
y: 0
invisible:true
attachedTo:1
#slave:true
projectile: 1

canAttackFlyingUnits: true
canAttackLandUnits:   false

turnSpeedAcceleration: 3.0

shoot_sound:ROOT:sounds\boltRifle_fire_1.wav
shoot_sound_vol:0.20
shoot_flame:small
shoot_light:#ffcc00
canShoot: true

recoilOffset: -1.5
recoilOutTime: 2
recoilReturnTime: 4
delay:83

[turret_1]
#
