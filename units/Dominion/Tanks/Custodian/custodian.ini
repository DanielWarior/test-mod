[core]
name: custodian
class: CustomUnitMetadata
price: credits=6000,thorium=600
maxHp: 2000
maxShield:1000
shieldRegen:0.3
mass: 2000
armour:5

tags:custodian
generation_credits:2

canRepairBuildings: true
canRepairUnits : true

#-temporarily disabled
#canRepairUnitsOnlyWithTags:repairable

selfRegenRate:0.2

displayText: Custodian HEV
displayDescription: -Dominion's high-tech frontline engineering and maintanence vehicle "Custodian" \n-can quickly repair other units, and has self repair and shields\n- Heavily armoured and armed, can hit both air and land \n-builds most types of factories and utility buildings\n-Capable of making t2 units on the field\n-Has built in fabricator\n-Limited to 6 per player\n-Can climb hills, due to being equipped with an auger drive and inversed hover pad underneath

displayText_ru: ТИТ Кустодий
displayDescription_ru: -Высокотехнологичная Фронтовая инжинерная и обслуживающая техника доминиона "Кустодий" \n-Может быстро чинить других юнитов и имеет само-починку и щиты\n-Тяжело бронирован и вооруженб стреляет по воздуху и земле\n-Строит большую часть строений и производственных зданий\n-Может строить т2 и т1 юнитов в поле\n-Имеет встроенный фабрикатор\n-максимум 6 на игрока\n-Может преодолевать скалы, ввиду своих шнэков и обратной воздушной подушки

techLevel: 2

buildSpeed: 35s
availableInDemo: true

radius: 36
shieldRenderRadius:40
displayRadius: 40

canReclaimResources: true
nanoRange: 250
nanoRepairSpeed:4.0
nanoBuildSpeed: 14.0

fogOfWarSightRange: 15

autoRepair: true
isBio: false
isBuilder: true

[graphics]

total_frames: 3

image:       custodian.png
