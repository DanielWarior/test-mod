shieldDamageMultiplier: 3.0
shieldDefectionMultiplier:0.50

buildingDamageMultiplier: 0.6

drawSize:0.75
lightColor: #ccffff
lightSize: 0.8
color:#00c0ff
image: ROOT:shared\graphics\shell.png

[movement]
