
[core]
name: anatis
class: CustomUnitMetadata
price: 1500
maxHp: 900
mass: 9000

techLevel: 2

displayText: Anatis ICV
displayDescription: -Infantry combat vehicle "Anatis" \n-Can carry 6 infantry units\-The infantry shoots out of the vehicle\n-can swim, but is slower in water\n-lightly armed, land attack

buildSpeed: 20s

radius: 20

isBio: false

maxTransportingUnits: 6

transportUnitsKillOnDeath: if self.isOverLiquid()
transportUnitsRequireMovementType: LAND,OVER_CLIFF

exit_x:0
exit_y:50

exit_dirOffset:0
exit_moveAwayAmount:40



[graphics]
total_frames: 4

image:        shepherd.png
image_wreak:  shepherd_wreck.png
image_turret: shepherd_turret.png

image_shadow: AUTO
shadowOffsetX:3
shadowOffsetY:3

animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 2

splastEffect: true
dustEffect: true


[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 5
turretTurnSpeed: 4
maxAttackRange: 160
shootDelay: 20

turretMultiTargeting: true


[turret_1]
x: 0
y: 30

projectile:1

shoot_sound:gun_fire
shoot_sound_vol:0.5
shoot_flame:small
shoot_light:#FFccCCEE

recoilOffset: -1
recoilOutTime: 4
recoilReturnTime: 6


[projectile_1]
directDamage: 15
life: 70
speed: 7

frame: 4

lightColor: #FFccCCEE
lightSize: 0.4

[movement]
movementType: HOVER
moveSpeed: 1.2
moveAccelerationSpeed: 0.08
moveDecelerationSpeed: 0.10


maxTurnSpeed: 1.3
turnAcceleration: 0.05

moveSlidingMode :true
moveIgnoringBody:true
targetHeight:0

[hiddenAction_movementOnWater]
autoTrigger: if self.overWater()
setUnitStats: moveSpeed = 0.8

[hiddenAction_movementOutOfWater]
autoTrigger: if not self.overWater()
setUnitStats: moveSpeed = 1.2

[attachment_1pas]
x:-7
y:10
addTransportedUnits:true
canAttack:true
setDrawLayerOnTop:true
isUnselectable:true
canBeAttackedAndDamaged:false
resetRotationWhenNotAttacking:true
smoothlyBlendPositionWhenExistingUnitAdded:false


[attachment_2pas]
@copyFromSection: attachment_1pas
x:7
y:10


[attachment_3pas]
@copyFromSection: attachment_1pas
x:-7
y:0


[attachment_4pas]
@copyFromSection: attachment_1pas
x:7
y:0

[attachment_5pas]
@copyFromSection: attachment_1pas
x:-7
y:-10

[attachment_6pas]
@copyFromSection: attachment_1pas
x:7
y:-10



