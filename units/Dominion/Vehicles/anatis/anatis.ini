
[core]
name: anatis
class: CustomUnitMetadata
price: 1400
maxHp: 1500
armour:2
mass: 9000

techLevel: 2

displayText: Anatis ICV
displayDescription: -Infantry combat vehicle "Anatis" \n-Can carry 4 infantry units\n-The infantry shoots out of the vehicle\n-can swim, but is slower in water\n-lightly armed, land attack

buildSpeed: 20s

radius: 20

isBio: false

maxTransportingUnits: 4

transportUnitsKillOnDeath: if self.isOverLiquid()
transportUnitsRequireMovementType: LAND,OVER_CLIFF

exit_x:0
exit_y:50

exit_dirOffset:0
exit_moveAwayAmount:40



[graphics]
total_frames: 3

image:        anatis.png
image_wreak:  anatis_wreck.png
image_turret: anatis_gun.png

image_shadow: AUTO
shadowOffsetX:3
shadowOffsetY:3

animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 2

splastEffect: true
dustEffect: true


[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 5
turretTurnSpeed: 8
maxAttackRange: 100
shootDelay: 9
turretMultiTargeting: true

isFixedFiring:true
aimOffsetSpread:0

[turret_1]
x: 4.5
y: 10

projectile:1

shoot_sound:gun_fire
shoot_sound_vol:0.25
shoot_flame:small
shoot_light:#FFccCCEE

recoilOffset: -1
recoilOutTime: 2
recoilReturnTime: 3

canAttackMaxAngle:40
[projectile_1]
directDamage: 4
life: 70
speed: 7

drawSize:0.7
frame: 1
lightColor: #ff8600
lightSize: 0.2

[movement]
movementType: HOVER
moveSpeed: 1.15
moveAccelerationSpeed: 0.3
moveDecelerationSpeed: 0.4
reverseSpeedPercentage:0.9

maxTurnSpeed: 3


moveSlidingMode :false
moveIgnoringBody:false
targetHeight:0

[hiddenAction_movementOnWater]
autoTrigger: if self.overWater()
setUnitStats: moveSpeed = 0.8

[hiddenAction_movementOutOfWater]
autoTrigger: if not self.overWater()
setUnitStats: moveSpeed = 1.3

[attachment_1pas]
x:-5
y:3
addTransportedUnits:true
canAttack:true
setDrawLayerOnTop:true
isUnselectable:true
canBeAttackedAndDamaged:false
resetRotationWhenNotAttacking:true
smoothlyBlendPositionWhenExistingUnitAdded:false


[attachment_2pas]
@copyFromSection: attachment_1pas
x:5
y:3


[attachment_3pas]
@copyFromSection: attachment_1pas
x:-5
y:-9


[attachment_4pas]
@copyFromSection: attachment_1pas
x:5
y:-9



