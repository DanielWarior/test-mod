turnSpeed: 5
barrelY: 15

canShoot: true


shoot_sound:ROOT:sounds\light_cannon_fire_1.wav
shoot_sound_vol:0.090
shoot_flame:small

[turret_1]
x: 0
y: 0
projectile: 1
canShoot:false


