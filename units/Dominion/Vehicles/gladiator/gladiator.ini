
[core]

name: gladiator

displayText: Gladiator LCV
displayDescription: -Mass produced Light Combat Vehicle "Gladiator"\n-ground attack

displayText_ru: Гладиатор ЛБМ
displayDescription_ru:-Пущенная в массовое производство боевая машина "Гладиатор"\n-Наземная атака

class: CustomUnitMetadata
price: 415
maxHp: 265
mass: 1200
armour:1

techLevel: 1
buildSpeed: 5s
#availableInDemo: true

radius: 12
displayRadius: 12

isBio: false
softCollisionOnAll: 0

[graphics]
total_frames: 3

teamColorsOnTurret: true
image:        gladiator.png
image_wreak:  gladiator_wreck.png
image_turret: gladiator_turret_base.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 1


dustEffect: true

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=100) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 10
turretTurnSpeed: 5


maxAttackRange: 130
shootDelay: 30

[turret_2]
#
x: 0
y: 0
image:gladiator_turret_barrel.png
attachedTo:1
slave:true

projectile: 1

recoilOffset: -6
