
[core]
name: mannerwagen
class: CustomUnitMetadata
price: 400
maxHp: 290
mass: 900

techLevel: 1

displayText: Mannerwagen 
displayDescription: -Dominion's mass produced light infatry transport car\n- Can carry 3 infantry units \n- units can shoot out of the vehicle

displayText_ru: Маннерваген
displayDescription_ru: -Поставлен в массовое производство лёгкий транспортный автомобиль Доминиона\n-Может перевозить до 3 пехотинцев\n-Пехотинцы могут стрелять из транспорта

transportUnitsUnloadDelayBetweenEachUnit:2

buildSpeed: 8s

radius: 17

isBio: false

maxTransportingUnits: 3
transportUnitsRequireTag:infantry
transportUnitsRequireMovementType: LAND,OVER_CLIFF,HOVER

exit_x:0
exit_y:14

exit_dirOffset:90
exit_moveAwayAmount:30



[graphics]
total_frames: 3

image:        mannerwagen.png
image_wreak:  mannerwagen_wreck.png
image_turret: NONE

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

animation_moving_start: 0
animation_moving_end: 2
animation_moving_speed: 2

dustEffect: true


[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 5
turretTurnSpeed: 4
maxAttackRange: 300
shootDelay: 25

turretMultiTargeting: true

[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=180)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-90)
addWaypoint_type: move
allowMultipleInQueue: false

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=190) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat


[turret_dummy]
x: 0
y: 0
canShoot: true
invisible:true
projectile:dummy

[projectile_dummy]
life: 1

directDamage: 0
areaDamage: 0
areaRadius: 0

speed: 1
instant: false

invisible: true
hitSound: false
explodeEffect: NONE
explodeEffectOnShield: NONE
trailEffect: false
largeHitEffect: false

[movement]
movementType: LAND
moveSpeed: 1.4
moveAccelerationSpeed: 0.3
moveDecelerationSpeed: 0.4
reverseSpeedPercentage:0.8

maxTurnSpeed: 7.5
turnAcceleration: 0.8

moveSlidingMode :false
moveIgnoringBody:false

[attachment_1pas]
x:5
y:3
addTransportedUnits:true
canAttack:true
setDrawLayerOnTop:true
isUnselectable:true
canBeAttackedAndDamaged:false
resetRotationWhenNotAttacking:true
smoothlyBlendPositionWhenExistingUnitAdded:true
prioritizeParentsMainTarget:true

[attachment_2pas]
@copyFromSection: attachment_1pas
x:-5
y:-7


[attachment_3pas]
@copyFromSection: attachment_1pas
x:5
y:-7
