
[core]
name: raeda
class: CustomUnitMetadata
price: 2000

maxHp: 2000
armour:3

mass: 12000

techLevel: 2

copyFrom:ROOT:Templates\customEffects.template

displayText: Raeda transport
displayDescription: -Dominion's amphibian vehicle transport \n-Has 6 unit slots \n-amphibious, but slower in water \n-well armoured

buildSpeed: 35s

radius: 30

isBio: false

maxTransportingUnits: 6

transportUnitsKillOnDeath: if self.isOverLiquid()
transportUnitsRequireMovementType: LAND,OVER_CLIFF,HOVER

exit_x:0
exit_y:50

exit_dirOffset:0
exit_moveAwayAmount:40



[graphics]
total_frames: 2

image:        raeda.png
image_wreak:  raeda_wreck.png
image_turret: raeda_turret.png

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2

splastEffect: true
dustEffect: true


[attack]
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretSize: 20
turretTurnSpeed: 4
maxAttackRange: 160
shootDelay: 10

turretMultiTargeting: true


[turret_1]
x: 0
y: 0

projectile:1

shoot_sound:ROOT:sounds\lmg_fire_2.wav
shoot_sound_vol:0.15
shoot_flame:small
shoot_light:#FFccCCEE

recoilOffset: -1
recoilOutTime: 4
recoilReturnTime: 6


[projectile_1]
directDamage: 6
life: 60
speed: 9

frame: 5

drawSize: 0.6

explodeEffect:CUSTOM:bullet_hit

[movement]
movementType: HOVER
moveSpeed: 1.0
moveAccelerationSpeed: 0.03
moveDecelerationSpeed: 0.08


maxTurnSpeed: 1.1
turnAcceleration: 0.05

moveSlidingMode :false
moveIgnoringBody:false
targetHeight:1

[hiddenAction_movementOnWater]
autoTrigger: if self.overWater()
setUnitStats: moveSpeed = 0.7,targetHeight=0

[hiddenAction_movementOutOfWater]
autoTrigger: if not self.overWater()
setUnitStats: moveSpeed = 1.0,targetHeight=1