
[core]
name: thruster
class: CustomUnitMetadata
price: 500
maxHp: 250
mass: 600

energyMax:1.2
energyNeedsToRechargeToFull:true
energyRegen:0.002
energyRegenWhenRecharging:0.0035

displayText: Thruster PV
displayDescription: -fast response vehicle\n-ground attack

displayText_ru: Трастер ПМ
displayDescription_ru:-Машина быстрого реагированний\n-Наземная атака 

techLevel: 1

buildSpeed: 7s
availableInDemo: true

radius: 15
displayRadius: 16


fogOfWarSightRange: 18


isBio: false

[graphics]

total_frames: 2
image:        thruster.png
image_wreak:  thruster_wreck.png
image_turret: thruster_turret_base.png

#AUTO
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 2

dustEffect: true

[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=130) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat

[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false

[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretTurnSpeed: 4

maxAttackRange: 130
shootDelay: 8

isFixedFiring: false

[turret_1]
x: 0
y: 0

attachedTo:2
slave:true

energyUsage:0.1

projectile: 1
size: 10
turnSpeed: 7

image:thruster_turret_barrel.png


shoot_sound:ROOT:sounds\lmg_fire_1.wav
shoot_sound_vol:0.08
shoot_flame:small
shoot_light:#FFccCCEE

recoilOffset: -3
recoilOutTime: 7
recoilReturnTime: 20

[turret_2]
x: 0
y: 0
projectile:1
canShoot:false
size: 10
turnSpeed: 7

[projectile_1]
directDamage: 12
life: 70
speed: 9
frame:5
drawSize: 0.8

[movement]
movementType: Land
moveSpeed: 1.6
moveAccelerationSpeed: 0.3
moveDecelerationSpeed: 0.4

maxTurnSpeed: 6.0
turnAcceleration: 2.5

moveSlidingMode :false
moveIgnoringBody:false