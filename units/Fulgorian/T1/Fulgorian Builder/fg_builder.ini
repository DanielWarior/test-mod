
[core]
name: fg_builder
class: CustomUnitMetadata
price: 700
maxHp: 500
mass: 700

tags:radar, repair

canRepairBuildings: true
canRepairUnits : true

#-temporarily disabled
#canRepairUnitsOnlyWithTags:repairable

selfRegenRate:0.05

displayText: Fulgorian Builder
displayDescription: - Builds Fulgorian buildings

techLevel: 1

buildSpeed: 12s
availableInDemo: true

radius: 16
displayRadius: 16

canReclaimResources: true
nanoBuildSpeed: 1.75
nanoRange: 180

fogOfWarSightRange: 15

#15 = default
fogOfWarSightRangeWhileNotBuilt: 15

autoRepair: true
isBio: false
isBuilder: true

#turret_animation begin
#{ 
#this is the memory for the turret animation:
@memory gun1:number

[hiddenAction_animGun1]
#Remove autotrigger if you want to tie the animation to something instead
autoTrigger:true

#this controlls how long the animation happens
setUnitMemory:gun1 = 5

[hiddenAction_animGunDrain]
autoTrigger:true
#this drains the memory
setUnitMemory: gun1 = select(memory.gun1 > 0, memory.gun1 - 1, memory.gun1)

[decal_gun1]
basePositionFromTurret:gun1
total_frames:2
image:fg_buildgun_remaster.png
teamColors: true

#this controlls what frame it selects, change the "%" value to how many frames the turret has
#Change the time alive multiplier to change how fast the animation happens
frame:select(memory.gun1 > 0,self.timeAlive*4.0 %2, 0)
isVisible: if self.hp > 0

layer:onTop
imageScaleY:1.0
imageScaleX:1.0
#turret_animation End
#} 

[graphics]
total_frames: 2

image:        fg_builder_remaster.png
image_wreak:  fg_builder_dead.png
image_turret: fg_buildgun_remaster.png
scaleTurretImagesTo: 16
teamColorsOnTurret:true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1


animation_idle_start: 0
animation_idle_end: 1
animation_idle_speed: 15

animation_moving_start: 0
animation_moving_end: 1
animation_moving_speed: 15

dustEffect: true

[attack]
canAttack: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false
maxAttackRange: 0

[turret_gun1]
#nano turret (nano must be slot 1)
x: 0
y: -2
warmup:30

#invisible so the decal is shown instead
invisible:true

canShoot: false
canAttackFlyingUnits: false
canAttackLandUnits:   false
canAttackUnderwaterUnits: false

turnSpeedAcceleration: 0.08

[movement]
movementType: HOVER
moveSpeed: 1
moveAccelerationSpeed: 0.4
moveDecelerationSpeed: 0.4

maxTurnSpeed: 3.0
turnAcceleration: 0.7

moveSlidingMode :false
moveIgnoringBody:false

[canBuild_4]
name: fg_Factory, fg_airFactory
pos:  2
tech: 1

[canBuild_7]
name: fg_watcher
pos:  6

[canBuild_8]
name: repairBay
pos:  5

[canBuild_10]
name: fg_turret_blaster
pos:  7

[canBuild_11]
name: fg_turret_stinger
pos:  8

[canBuild_16]
name: fg_extractorT1
pos:  1
tech: 1

[canBuild_17]
name: reclaim
pos:  -1

[ai]
useAsBuilder: true