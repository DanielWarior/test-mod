
[core]
name: fg_walker
class: CustomUnitMetadata
price: 900
mass: 2000
maxHp: 500
maxShield: 100
shieldRegen: 0.15
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 15

displayText: Fulgorian Walker
displayDescription:- Can transport 2 small sized units\n- Can walk over any terrain
techLevel: 1
buildSpeed: 15s

#transportUnitsRequireTag:size1,size2
transportUnitsCanUnloadUnits: true
maxTransportingUnits: 2
transportUnitsKillOnDeath: if self.isOverLiquid()
transportUnitsRequireMovementType: LAND,OVER_CLIFF,HOVER

radius: 18
softCollisionOnAll: 24

[graphics]

image:        fg_walker.png
image_wreak:  fg_walker_dead.png
image_turret: ROOT:shared/graphics/blank.png
scaleImagesTo: 45
#scaleTurretImagesTo: 7
teamColorsOnTurret: true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

[attack]
turretRotateWithBody: true

canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

isFixedFiring: true
disablePassiveTargeting: true

turretSize: 15
turretTurnSpeed: 0.8
maxAttackRange: 180

[turret_0]
x: 0
y: 0
idleDir:0
projectile: 1
invisible: true
canShoot: false

[turret_1]
x: 12
y: 0
idleDir:0
projectile: 1
attachedTo: 0
slave: true
turnSpeed: 0
turnSpeedAcceleration: 0
delay: 1s

shoot_sound: plasma_fire
shoot_sound_vol: 0.1
shoot_flame: CUSTOM:sparks2*3
shoot_light: #FFcceeee

[turret_2]
copyFrom: 1
x: -12
y: 0
idleDir:0
projectile: 1
attachedTo: 0
slave: true
warmup: 0.1s
linkDelayWithTurret: 1

[projectile_1]
directDamage: 10
life: 55
speed: 20
image: ROOT:shared/graphics/fg_proj1.png
drawSize: 0.8
lightColor: #ccffff
lightSize: 0.5

explodeEffect: CUSTOM:lightningShock, CUSTOM:sparks*2
explodeEffectOnShield: CUSTOM:lightningShock*1, CUSTOM:hitLightFlash

[attachment_1pas]
x:-14
y: 0
lockRotation: true
addTransportedUnits:true
canAttack:false
setDrawLayerOnTop:true
isUnselectable:true
canBeAttackedAndDamaged:false
keepAliveWhenParentDies:true
smoothlyBlendPositionWhenExistingUnitAdded:false

idleDir:0

[attachment_2pas]
@copyFromSection: attachment_1pas
x: 14
idleDir:0

[leg_1]
x: -10
y: 0
attach_x: 5
attach_y: 0
moveSpeed: 2.6
heightSpeed: 1
moveWarmUp:4
resetAngle: 15
dust_effect: false
holdDisMin: 8
holdDisMax: 12
holdDisMin_maxMovingLegs: 2
estimatingPositionMultiplier: 0.4
image_leg: fg_walker_leg.png
image_foot: fg_walker_foot.png
image_foot_shadow: SHADOW:fg_walker_foot.png
draw_foot_on_top: false
favourOppositeSideNeighbours: true

[leg_2]
@copyFromSection: leg_1
x: 10
y: 0
attach_x: 5
attach_y: 0

[effect_hitLightFlash]
priority: high
image: SHARED:light_50.png
life: 17
fadeOut: true
attachedToUnit: false
color: #63e6e8
scaleFrom: 1.8
scaleTo: 1.8
alpha: 0.6
drawUnderUnits: false

[effect_lightningShock]
life: 60
hOffset: 0
dirOffset: 0
fadeInTime: 0
fadeOut: false
attachedToUnit: true
image: SHARED:lightning_shock.png
total_frames: 14
scaleFrom: 0.5
scaleTo: 0.5
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.5

[effect_sparks]
attachedToUnit: false
life: 50
physics: true
xSpeedRelativeRandom: 1.2
ySpeedRelativeRandom: 1.2
hSpeed: 2
image: SHARED:spark.png
priority: verylow

[effect_sparks2]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: SHARED:spark.png
priority: verylow

[movement]
movementType: AIR
moveSpeed: 1
moveAccelerationSpeed: 0.02
moveDecelerationSpeed: 0.02

#reverseSpeedPercentage: 1
targetHeight: 0
targetHeightDrift: 0
startingHeightOffset: 2

maxTurnSpeed: 3
turnAcceleration: 0.08

moveSlidingMode: true
moveIgnoringBody: true
moveSlidingDir: 181

[ai]
useAsTransport:true

