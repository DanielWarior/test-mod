[core]
name: fg_skewer
class: CustomUnitMetadata
price: 2000
maxHp: 600
maxShield: 250
shieldRegen: 0.15
shieldDeflectionDisplayRate: 1
shieldDisplayOnlyDeflection: true
shieldRenderRadius: 15
mass: 3000
transportSlotsNeeded: 2

displayText: Fulgorian Skewer
displayDescription: - Shoots a single heavy bolt that pierces through enemies \n- Has long range but slow reload

techLevel: 2
buildSpeed: 22s
#availableInDemo: true

radius: 15
displayRadius: 15


[graphics]
total_frames: 4

image:        fg_skewer_base.png
image_wreak:  fg_skewer_dead.png
image_turret: fg_skewer_turret_e.png
scaleImagesTo: 40
scaleTurretImagesTo: 30
teamColorsOnTurret: true

image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1

animation_moving_start: 0
animation_moving_end: 3
animation_moving_speed: 2

[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits:   true
canAttackUnderwaterUnits: false

turretTurnSpeed: 4
shootDelay: 3.3s
maxAttackRange: 280

[turret_1]
x: 0
y: -5
barrelY: 5
projectile: 1
turnSpeedAcceleration: 1.0
warmup: 0.5s

aimOffsetSpread:0

shoot_sound:tank_firing
shoot_sound_vol:1
shoot_flame: CUSTOM:sparks2*3, CUSTOM:light
shoot_light: #FFcceeee

recoilOffset: -5
recoilOutTime: 6
recoilReturnTime: 18

onShoot_triggerActions: resetTimer

[projectile_1]
spawnUnit: Piercing Projectile(offsetDir=0)
explodeOnEndOfLife: true
life: 1
speed: 1
drawSize: 0
directDamage: 150
explodeEffect: NONE

[decal_spike]
basePositionFromTurret: 1
image: fg_spike.png
isVisible: if self.customTimer() >= 3 and self.hp > 0

layer:onTop
imageScaleY:0.5
imageScaleX:0.5
yOffsetRelative: 15

[hiddenAction_resetTimer]
resetCustomTimer: true

[effect_sparks]
attachedToUnit: false
life: 60
physics: true
fadeOut: true
spawnChance: 0.5
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: SHARED:spark.png
priority: verylow

[effect_sparks2]
attachedToUnit: false
life: 150
physics: true
xSpeedRelativeRandom: 0.5
ySpeedRelativeRandom: 0.5
hSpeed: 1
image: SHARED:spark.png
priority: verylow

[effect_hitLightFlash]
priority: high
image: SHARED:light_50.png
life: 15
fadeOut: true
attachedToUnit: false
color: #ccffff
#color: #63e6e8
scaleFrom: 0.1
scaleTo: 0.1
alpha: 2
drawUnderUnits: false

[effect_light]
priority: high
image: SHARED:light_50.png
life: 15
fadeOut: true
attachedToUnit: false
color: #ccffff
scaleFrom: 0.3
scaleTo: 0.3
alpha: 0.6
drawUnderUnits: true

[effect_lightningShock]
life: 60
hOffset: 0
dirOffset: 0
fadeInTime: 0
fadeOut: false
attachedToUnit: false
image: SHARED:lightning_shock.png
scaleFrom: 1
scaleTo: 1
total_frames: 14
animateFrameStart: 0
animateFrameEnd: 13
animateFramePingPong: false
animateFrameSpeed: 0.6

[effect_lightSlowFade]
image: SHARED:light_50.png
life: 40
fadeOut: true
attachedToUnit: true
color: #63e6e8
scaleFrom: 0.7
scaleTo: 0.7
alpha: 0.5
drawUnderUnits:true

[effect_projectileTrail]
image: SHARED:light_50.png
life: 12
fadeOut: true
attachedToUnit: false
color: #ccffff
fadeInTime:2
scaleFrom: 0.3
scaleTo: 0.3
alpha: 0.4
drawUnderUnits:true
#ySpeedRelative:-1

[effect_projectilePassThough]
priority:high
frameIndex: 4
stripIndex: projectiles2
life: 20
fadeOut: true
attachedToUnit: false
color: #FFFFFF
scaleFrom: 1
scaleTo: 0.5
alpha: 1
drawUnderUnits:false
ySpeedRelative:2
atmospheric: true

[movement]
movementType: LAND
moveSpeed: 0.85
moveAccelerationSpeed: 0.10
moveDecelerationSpeed: 0.12

reverseSpeedPercentage: 0.85

maxTurnSpeed: 2
turnAcceleration: 0.3

moveSlidingMode :false
moveIgnoringBody:false





