
[core]
name: cancer_mi_missile
displayText: Cancer Mikanate
displayDescription: -Oculian Mikanate Missile Bomber \n-Carries a powerful Kilopixel torpedo, but is less mobile than usual. \n-Requires a fighter factory in order to reload the torpedo. \n-1x Cancer Kilopixel (800 Damage\130% Hull Damage\60% Shield Damage)
class: CustomUnitMetadata
price: credits=3000, crystal=100
maxHp: 220
maxShield: 80
shieldRegen: 0.16
mass: 250
techLevel: 3
buildSpeed: 20s
radius: 20
displayRadius: 20
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 10
energyMax: 1
energyRegen: 0
energyNeedsToRechargeToFull: true
transportSlotsNeeded: 3
tags: air



[graphics]
total_frames: 1
image: cancer_mi_missile.png
image_wreak: cancer_mi_dead.png
image_turret: NONE
imageScale:1
turretImageScale:1
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits:   true
canAttackUnderwaterUnits: true
maxAttackRange: 450
shootDelay: 1s
turretMultiTargeting: true
attackMovement: bomber



[turret_1]
invisible: true
x: 0
y: 2
idleDir: 0
projectile: dummy
turnSpeed: 60
shoot_sound:ROOT:sounds\Oculian_Armada\annihilator_fire_01.ogg
shoot_sound_vol:1
aimOffsetSpread: 0
limitingAngle: 30
energyUsage: 1
onShoot_triggerActions: fire,BomberAi
canOnlyAttackUnitsWithoutTags: missile, missileIN, NoMissile



[projectile_dummy]
life: 1

directDamage: 0
areaDamage: 0
areaRadius: 0

speed: 1
instant: false

invisible: true
hitSound: false
explodeEffect: NONE
explodeEffectOnShield: NONE
trailEffect: false
largeHitEffect: false



[movement]
movementType: AIR
targetHeightDrift: 1
moveSpeed: 1.5
moveAccelerationSpeed: 0.035
moveDecelerationSpeed: 0.045
reverseSpeedPercentage: 0
maxTurnSpeed: 2.5
turnAcceleration: 1.6
moveSlidingMode :true
slowDeathFall: true
landOnGround: onlyIdle



[attachment_1]
x: -8
y: 10
idleDir: 0
isVisible: false
onCreateSpawnUnitOf: glint_cancer
isUnselectable: true
deattachIfWantingToMove: false
rotateWithParent: true
resetRotationWhenNotAttacking: true
prioritizeParentsMainTarget: true



[attachment_2]
@copyFromSection: attachment_1
x: 8
y: 10



[attachment_3]
x:0
y:2
idleDir:0
idleDirReversing: 0
isVisible:false
isUnselectable:true
deattachIfWantingToMove: false
setDrawLayerOnTop:true
addTransportedUnits:true
lockRotation:false
rotateWithParent: true
resetRotationWhenNotAttacking: true
prioritizeParentsMainTarget:true



[hiddenAction_unload]
autoTrigger: if self.isEnergyEmpty

convertTo: cancer_mi



[hiddenAction_GETOUT]
autoTriggerOnEvent: created

disconnectFromParent: true
clearAllWaypoints: false
addWaypoint_type: move
addWaypoint_prepend: true
addWaypoint_position_relativeOffsetFromSelf: 90, 0



[hiddenAction_BomberAi]
addWaypoint_prepend:true
clearActiveWaypoint:true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-200)
addWaypoint_type: move
allowMultipleInQueue: false



[hiddenAction_fire]
buildSpeed: 0s

attachments_addNewUnits: kilopixel_torpedo_cancer_mi