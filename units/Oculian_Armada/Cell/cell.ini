
[core]
name: cell
displayText: Cell
displayDescription: -Oculian Air Transport \n-Transports a single unit, requires to stop moving to drop \n-Strong shield for cost
class: CustomUnitMetadata
price: 500
maxHp: 100
maxShield: 400
shieldRegen: 0.2
mass: 50
techLevel: 1
buildSpeed: 6s
radius: 15
displayRadius: 15
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 10
tags: air
maxTransportingUnits: 1
transportUnitsCanUnloadUnits:if not self.isMoving()
exit_x:0
exit_y:0



[graphics]
total_frames: 1
image: cell.png
image_wreak: cell_dead.png
image_turret: NONE
imageScale:1
turretImageScale:1
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1



[attack]
canAttack: false



[hiddenAction_cargo]
autoTrigger:if self.transportingCount(greaterThan=0)
setUnitStats:moveSpeed=1.75



[hiddenAction_nocargo]
autoTrigger:if self.transportingCount(lessThan=1)
resetUnitStats:true



[attachment_1]
x:0
y:0
addTransportedUnits:true
canAttack:false
setDrawLayerOnTop:false
isUnselectable:true
canBeAttackedAndDamaged:false
resetRotationWhenNotAttacking:true
smoothlyBlendPositionWhenExistingUnitAdded:true
idleDir:0



[movement]
movementType: AIR
targetHeightDrift: 1
moveSpeed: 2.25
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.05
reverseSpeedPercentage: 0
maxTurnSpeed: 2
turnAcceleration: 2
moveSlidingMode :true
moveIgnoringBody: true
slowDeathFall: true