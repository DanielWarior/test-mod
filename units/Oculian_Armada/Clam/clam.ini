
[core]
name: clam
displayText: Clam
displayDescription: -Oculian Hover Basic AA Unit \n-Hover unit with modified glints that specifically attack air for more damage. \n-3x Glints (AA) (90 DPS 150 Range)
class: CustomUnitMetadata
price: 700
maxHp: 300
maxShield: 200
shieldRegen: 0.05
mass: 300
techLevel: 1
buildSpeed: 8s
radius: 12
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 15



[graphics]
total_frames: 1
image: clam.png
image_wreak: clam_dead.png
image_turret: ROOT:\shared\graphics\glint.png
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: false
canAttackUnderwaterUnits: false
maxAttackRange: 150
shootDelay: 1s



[hiddenAction_prioritize]
autoTrigger: if self.isAttacking and not self.hasActiveWaypoint(type='attack') and self.numberOfUnitsInEnemyTeam(withTag='missile', greaterThan=0, withinRange=150)
addWaypoint_target_nearestUnit_tagged: missile
addWaypoint_target_nearestUnit_team: enemy
addWaypoint_type: attack
addWaypoint_prepend: true
addWaypoint_maxTime: 1s
allowMultipleInQueue:false



[turret_1]
x: 0
y: 6
idleDir:0
projectile: beam
turnSpeed: 4
shoot_sound:ROOT:sounds\Oculian_Armada\ocua_glint_fire1.wav
shoot_sound_vol:0.125
aimOffsetSpread: 0
limitingRange: 150
barrelY: 4



[turret_2]
x: -5
y: -3
idleDir:-120
projectile: beam
turnSpeed: 4
shoot_sound:ROOT:sounds\Oculian_Armada\ocua_glint_fire1.wav
shoot_sound_vol:0.125
aimOffsetSpread: 0
limitingRange: 150
barrelY: 4



[turret_3]
x: 5
y: -3
idleDir:120
projectile: beam
turnSpeed: 4
shoot_sound:ROOT:sounds\Oculian_Armada\ocua_glint_fire1.wav
shoot_sound_vol:0.125
aimOffsetSpread: 0
limitingRange: 150
barrelY: 4



[projectile_beam]
directDamage: 30
deflectionPower: -1
life: 15
instant: true
beamImage: SHARED:beam3.png
beamImageEnd: SHARED:beam1_end.png
moveWithParent: true
explodeEffect: NONE
explodeEffectOnShield: NONE
color: #9bff9b



[movement]
movementType: HOVER
targetHeight: 4
targetHeightDrift: 1
moveSpeed: 1.5
moveAccelerationSpeed: 0.05
moveDecelerationSpeed: 0.06
maxTurnSpeed: 2
turnAcceleration: 2.5
moveSlidingMode :true
moveIgnoringBody:true