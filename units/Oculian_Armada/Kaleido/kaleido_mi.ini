
[core]
name: kaleido_mi
displayText: Kaleido Mikanate
displayDescription: -Oculian Mikanate Gunship Unit \n-Even further upgraded form equipped with a Deci Pixie and another Kea, further increasing crowd control \n-1x Deci Pixie (17 DPS 175 Range) \n-1x Glint (20 DPS 150 Range) \n-4x Kea (112 DPS 120 Range)
class: CustomUnitMetadata
price: credits=1750, crystal=50
maxHp: 400
maxShield: 800
shieldRegen: 0.33
mass: 400
techLevel: 3
buildSpeed: 18s
radius: 16
displayRadius: 16
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 10
tags: shield, air



[graphics]
total_frames: 1
image: kaleido_mi.png
image_wreak: kaleido_mi_dead.png
image_turret: NONE
imageScale:1
turretImageScale:1
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1



[attack]
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 120
shootDelay: 1s
turretMultiTargeting: true
isFixedFiring: true



[hiddenAction_flee]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.shield(lessThan=80) and not self.hp(lessThan=200)
temporarilyAddTags: flee



[hiddenAction_fleeing]
autoTrigger: if self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=400) and self.tags(includes='flee')

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-90)
addWaypoint_type: move
allowMultipleInQueue: false



[hiddenAction_stopflee]
autoTrigger: if self.tags(includes='flee') and self.shield(greaterThan=400)
temporarilyRemoveTags: flee



