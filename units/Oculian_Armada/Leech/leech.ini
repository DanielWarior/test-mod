
[core]
name: leech
displayText: Leech
displayDescription: -Oculian Anti-Shield Skirmisher Unit \n-Hover unit that can safely kite against slower units, also effective against shielded units. Can also attack underwater units. \n-2x Shena (60 DPS 200 Range\200% Shield Damage\25% Building Damage)
class: CustomUnitMetadata
price: 1000
maxHp: 250
maxShield: 50
shieldRegen: 0.05
mass: 300
techLevel: 1
buildSpeed: 14s
radius: 14
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 15



[graphics]
total_frames: 1
image: leech.png
image_wreak: leech_dead.png
image_turret: ROOT:\shared\graphics\shena.png
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: false
canAttackLandUnits: true
canAttackUnderwaterUnits: true
maxAttackRange: 200
shootDelay: 1s



[hiddenAction_kite]
autoTrigger: if self.isAttacking() and self.isControlledByAI() and self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=180)

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-60)
addWaypoint_type: move
allowMultipleInQueue: false



[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=200) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat



[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false



[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat



[turret_1]
x: -6
y: -3
idleDir:0
projectile: 1
turnSpeed: 3
shoot_sound:ROOT:sounds\Oculian_Armada\ocua_shena_fire1.wav
shoot_sound_vol:0.2
aimOffsetSpread: 0



[turret_2]
x: 6
y: -3
idleDir:0
projectile: 1
turnSpeed: 3
shoot_sound:ROOT:sounds\Oculian_Armada\ocua_shena_fire1.wav
shoot_sound_vol:0.2
aimOffsetSpread: 0



[projectile_1]
directDamage: 30
shieldDamageMultiplier: 2
shieldDefectionMultiplier:0.9
buildingDamageMultiplier: 0.25
deflectionPower: 2
life: 300
speed: 6.67
drawSize: 1
color: #ff6478
lightColor: #ff6478
lightSize: 0.5



[movement]
movementType: HOVER
targetHeight: 4
targetHeightDrift: 1
moveSpeed: 1.1
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.05
maxTurnSpeed: 1.5
turnAcceleration: 2
moveSlidingMode :true
moveIgnoringBody:true