
[core]
name: mussel
displayText: Mussel
displayDescription: -Oculian Hover T2 AA Unit \n-Larger version of clam with a gleam that can hit farther. \n-1x Gleam (AA) (120 DPS 250 Range) \n-2x Glints (AA) (60 DPS 150 Range)
class: CustomUnitMetadata
price: 1400
maxHp: 800
maxShield: 400
shieldRegen: 0.1
mass: 500
techLevel: 1
buildSpeed: 12s
radius: 16
isBio: false
softCollisionOnAll: 3
fogOfWarSightRange: 15



[graphics]
total_frames: 1
image: mussel.png
image_wreak: mussel_dead.png
image_turret: ROOT:\shared\graphics\gleam.png
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
dustEffect: true
teamColorsOnTurret: true



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: false
canAttackUnderwaterUnits: false
maxAttackRange: 280
shootDelay: 1s



[hiddenAction_prioritize]
autoTrigger: if self.isAttacking and not self.hasActiveWaypoint(type='attack') and self.numberOfUnitsInEnemyTeam(withTag='missile', greaterThan=0, withinRange=250)
addWaypoint_target_nearestUnit_tagged: missile
addWaypoint_target_nearestUnit_team: enemy
addWaypoint_type: attack
addWaypoint_prepend: true
addWaypoint_maxTime: 1s
allowMultipleInQueue:false



[turret_1]
x: 0
y: 3
idleDir:0
projectile: beam
turnSpeed: 5
shoot_sound:ROOT:sounds\Oculian_Armada\ocua_gleam_fire1.wav
shoot_sound_vol:0.3
aimOffsetSpread: 0
barrelY: 4



[projectile_beam]
directDamage: 120
deflectionPower: -1
life: 30
drawSize: 1.5
instant: true
beamImage: SHARED:beam3.png
beamImageEnd: SHARED:beam1_end.png
moveWithParent: true
explodeEffect: NONE
explodeEffectOnShield: NONE
color: #9bff9b



[attachment_1]
x: -10
y: -8
idleDir: -120
isVisible: true
onCreateSpawnUnitOf: glint_mussel
isUnselectable: true
deattachIfWantingToMove: false
rotateWithParent: true
resetRotationWhenNotAttacking: true
prioritizeParentsMainTarget: true



[attachment_2]
@copyFromSection: attachment_1
x: 10
y: -8
idleDir: 120



[movement]
movementType: HOVER
targetHeight: 4
targetHeightDrift: 1
moveSpeed: 1.25
moveAccelerationSpeed: 0.04
moveDecelerationSpeed: 0.05
maxTurnSpeed: 2
turnAcceleration: 2.5
moveSlidingMode :true
moveIgnoringBody:true