
[core]
name: tick
displayText: Tick
displayDescription: Oculian Flying Mech \n-Powerful unit that can swap between an interceptor or a land mech \n-1x Deci Pixie (17 DPS 175 Range) \n-2x Tick-Type Delayed Fouette (63 DPS 130 range)\n-2x Glint (40 DPS 150 Range) \n-2x Pirouette (40 DPS 130 range)
class: CustomUnitMetadata
price: 2000
maxHp: 400
maxShield: 500
shieldRegen: 0.1
mass: 500
techLevel: 1
buildSpeed: 16s
radius: 20
isBio: false
softCollisionOnAll: 2
fogOfWarSightRange: 20
tags: air, shield
transportSlotsNeeded: 2



[graphics]
total_frames: 1
image: tick.png
image_wreak: tick_dead.png
image_turret: NONE
imageScale:1
turretImageScale:1
lock_body_rotation_with_main_turret: false
image_shadow: AUTO
shadowOffsetX:1
shadowOffsetY:1
teamColorsOnTurret: true



[attack]
turretRotateWithBody: true
canAttack: true
canAttackFlyingUnits: true
canAttackLandUnits: true
canAttackUnderwaterUnits: false
maxAttackRange: 130
shootDelay: 1s
isFixedFiring: true


[action_land]
whenBuilding_temporarilyConvertTo: tick_landing
text: Land
description: Becomes a ground mech to shoot at land units but loses most of it's capabilities at shooting air. /nCuts Shield by 2x and Tick Fouette's DPS by 3x
canPlayerCancel: false
ai_isDisabled: true
convertTo: tick_mech



[hiddenAction_lander]
autoTrigger: if self.isControlledByAI() and self.isAttacking() and not attacking.tags(includes='air') and not self.tags(includes='landing') and not self.tags(includes='mech') and not self.tags(includes='retreat') and not self.tags(includes='flee')
alsoQueueAction: land



[hiddenAction_flee]
autoTrigger: if self.isControlledByAI() and self.shield(lessThan=100) and not self.tags(includes='retreat')
temporarilyAddTags: flee



[hiddenAction_fleeing]
autoTrigger: if self.numberOfUnitsInEnemyTeam(greaterThan=0, withinRange=500) and self.tags(includes='flee') and not self.tags(includes='retreat')

clearAllWaypoints: true
addWaypoint_target_fromReference: createMarker(x=self.x, y=self.y, dir=direction(self.x, self.y, attacking.x, attacking.y)).getOffsetRelative(y=-90)
addWaypoint_type: move
allowMultipleInQueue: false



[hiddenAction_stopflee]
autoTrigger: if self.tags(includes='flee') and not self.tags(includes='retreat') and self.shield(greaterThan=250)
temporarilyRemoveTags: flee



[hiddenAction_retreat]
autoTrigger: if self.isControlledByAi() and self.hp(lessThan=200) and not self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
temporarilyAddTags: retreat



[hiddenAction_retreating]
autoTrigger: if self.tags(includes='retreat')
requireConditional: if self.numberOfUnitsInTeam(withTag='repair', greaterThan=0, withinRange=1000)
clearAllWaypoints: true
addWaypoint_target_nearestUnit_tagged: repair
addWaypoint_target_nearestUnit_team: own
addWaypoint_type: move
allowMultipleInQueue:false



[hiddenAction_active]
autoTrigger: if self.tags(includes='retreat') and (self.hp() == self.maxHp())
temporarilyRemoveTags: retreat



